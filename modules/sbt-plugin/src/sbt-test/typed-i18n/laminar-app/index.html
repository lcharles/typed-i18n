<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>typed-i18n Laminar demo</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #16202a;
        color: #17202a;
      }

      .shell {
        width: min(34rem, calc(100% - 2rem));
      }

      .locale-picker {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
      }

      .locale-picker a,
      #appContainer button {
        border: 0;
        border-radius: 0.5rem;
        padding: 0.65rem 1rem;
        cursor: pointer;
      }

      .locale-picker a {
        background: #dbeafe;
        color: #17202a;
        text-decoration: none;
      }

      #appContainer main {
        padding: 2rem;
        border-radius: 1rem;
        background: #ffffff;
        box-shadow: 0 1rem 3rem rgb(0 0 0 / 25%);
      }

      #appContainer h1 {
        margin-top: 0;
      }

      #appContainer button {
        background: #2563eb;
        color: #ffffff;
      }

    </style>
  </head>
  <body>
    <div class="shell">
      <div class="locale-picker" aria-label="Choose language">
        <a href="./index.html?locale=en">English</a>
        <a href="./index.html?locale=fr">Français</a>
      </div>
      <div id="appContainer"></div>
    </div>

    <script src="./target/scala-3.9.0/root-fastopt/main.js"></script>
  </body>
</html>
